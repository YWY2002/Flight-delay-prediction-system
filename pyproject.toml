[project]
name = "flight-delay-pipeline"
version = "0.1.0"
description = "Live flight + weather ingestion, approach-anomaly detection, and airport delay-cascade prediction - built as a production-shaped ML pipeline."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies stay empty until a phase actually needs one.
# We add a dep in the same commit as the code that imports it - never "just in case".
dependencies = [
    "defusedxml>=0.7.1",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "opensky-api>=1.4.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "pyspark>=4.2.0",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    # Not imported anywhere by us. Python's `zoneinfo` reads the SYSTEM timezone
    # database, which Windows does not have and slim Linux containers usually
    # strip. Without it pyarrow cannot resolve even "UTC" when converting
    # timestamp columns back to Python, so reading our own Parquet fails. An
    # explicit dependency beats a platform-dependent runtime crash.
    "tzdata>=2026.3",
]

[project.scripts]
# Re-add as the ingestion package is rebuilt. The reference implementation in
# ingestion_example/ wired these to `ingest.poller:main` and
# `ingest.opensky.aircraft_metadata:main`.
# flight-delay-ingest = "flight_delay.ingest.poller:main"
# flight-delay-aircraft-db = "flight_delay.ingest.opensky.aircraft_metadata:main"

[project.optional-dependencies]
# (left for future runtime extras, e.g. serving-only or training-only installs)

# PEP 735 dependency groups: dev-only tools, never shipped in the wheel.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=4.6.1",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_delay"]

# ---- Linting / formatting (ruff replaces black + isort + flake8) ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]

# ---- Type checking ----
[tool.mypy]
python_version = "3.12"
# Strict is aggressive on purpose - this is a learning repo and types catch
# a whole class of bugs before runtime. Dial back here if it gets noisy.
strict = true
files = ["src", "tests"]

# pyarrow ships no py.typed marker, so mypy cannot see its types. Scoped to this
# one library rather than relaxing the setting globally: everything we write
# stays strictly checked.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# Same story for the official OpenSky client: a single module, no py.typed.
# Note it is `opensky_api`, not `opensky_api.*` - it is one flat module rather
# than a package, so the wildcard form matches nothing.
[[tool.mypy.overrides]]
module = ["opensky_api"]
ignore_missing_imports = true

# ---- Tests ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.uv.sources]
opensky-api = { git = "https://github.com/openskynetwork/opensky-api.git", subdirectory = "python" }
